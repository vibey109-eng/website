<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Members · Lithos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
<style>
  .members-table {
    width: 100%;
    border-collapse: collapse;
  }
  .members-table th {
    text-align: left;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    padding: 0.75rem 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .members-table td {
    padding: 0.9rem 1rem;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.85);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .members-table tr:hover td {
    background: rgba(255,255,255,0.03);
  }
</style>
</head>
<body class="bg-[#05070d] min-h-screen" style="font-family:'Inter',sans-serif;">

  <nav class="sticky top-0 z-50 flex flex-wrap items-center justify-between gap-4 p-4 sm:p-5 bg-[#05070d]/90 backdrop-blur-md border-b border-white/10">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/logo.png" alt="Lithos" class="h-8 sm:h-9 w-auto" />
    </a>
    <div class="flex flex-wrap justify-center absolute left-1/2 -translate-x-1/2 items-center gap-1 bg-white/10 border border-white/20 rounded-full px-2 py-2 max-w-[92vw]">
      <a href="stars.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Stars</a>
      <a href="company.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Company</a>
      <a href="notice.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Notice</a>
      <a href="memo.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Memo</a>
    </div>
    <a href="signup.html" id="navAuthBtn" class="bg-white text-gray-900 text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-100">Sign Up</a>
  </nav>

  <section class="max-w-4xl mx-auto px-6 py-16 sm:py-20">
    <div class="mb-10">
      <p class="hero-fade-in text-white/50 text-xs font-semibold tracking-[0.3em] uppercase mb-4" style="animation-delay:0.05s;">
        Admin
      </p>
      <h1 class="hero-fade-in text-white text-4xl sm:text-5xl font-semibold tracking-tight mb-4" style="animation-delay:0.15s;">
        Members
      </h1>
      <p class="hero-fade-in text-white/50 text-sm max-w-xl" style="animation-delay:0.3s;">
        ※ 이 목록은 <strong>이 브라우저에 가입한 회원만</strong> 보여줘요. 별도
        서버/데이터베이스가 없는 정적 사이트라, 다른 사람이 다른 기기에서
        가입한 내역은 여기서 보이지 않아요. 모두가 공유하는 실제 회원
        데이터베이스가 필요하면 백엔드(예: Firebase, Supabase 등) 연동이
        필요해요.
      </p>
    </div>

    <div class="glass-card reveal p-6 sm:p-8" style="transition-delay:0.1s;">
      <div class="flex items-center justify-between mb-4">
        <p id="memberCount" class="text-white/60 text-sm"></p>
        <button id="clearMembersBtn" class="text-white/40 hover:text-red-400 text-xs transition-colors">전체 삭제</button>
      </div>
      <div class="overflow-x-auto">
        <table class="members-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Birth Month</th>
              <th>Joined</th>
            </tr>
          </thead>
          <tbody id="membersBody"></tbody>
        </table>
      </div>
      <p id="emptyState" class="text-white/30 text-sm text-center py-10 hidden">
        아직 가입한 회원이 없어요.
      </p>
    </div>
  </section>

  <footer class="text-center text-white/30 text-xs pb-12">
    <a href="index.html" class="underline hover:text-white/60">← Back to home</a>
  </footer>

  <script>
    const MEMBERS_KEY = "lithosMembers";

    function loadMembers() {
      try {
        const raw = localStorage.getItem(MEMBERS_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function renderMembers() {
      const members = loadMembers();
      const body = document.getElementById("membersBody");
      const emptyState = document.getElementById("emptyState");
      const countEl = document.getElementById("memberCount");

      countEl.textContent = `총 ${members.length}명`;
      body.innerHTML = "";

      if (members.length === 0) {
        emptyState.classList.remove("hidden");
        return;
      }
      emptyState.classList.add("hidden");

      members
        .slice()
        .reverse()
        .forEach((m) => {
          const tr = document.createElement("tr");
          const joined = m.joinedAt ? new Date(m.joinedAt).toLocaleString("ko-KR") : "-";
          tr.innerHTML = `
            <td>${m.name || "-"}</td>
            <td>${m.email || "-"}</td>
            <td>${m.month || "-"}</td>
            <td>${joined}</td>
          `;
          body.appendChild(tr);
        });
    }

    document.getElementById("clearMembersBtn").addEventListener("click", () => {
      if (confirm("전체 회원 목록을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
        localStorage.removeItem(MEMBERS_KEY);
        renderMembers();
      }
    });

    renderMembers();
  </script>

  <script src="common.js"></script>

</body>
</html>
