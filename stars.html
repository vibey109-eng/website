<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stars · Lithos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
<style>
  .star-card {
    position: relative;
    overflow: hidden;
    border-radius: 1rem;
    aspect-ratio: 3 / 4;
    background: #0a0d16;
    opacity: 0;
    transform: translateY(32px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 10px 20px rgba(0,0,0,0.45);
    transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s ease;
  }
  .star-card.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  .star-card:hover {
    box-shadow: 0 35px 70px rgba(0,0,0,0.75), 0 15px 30px rgba(0,0,0,0.55);
  }
  .star-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.7s cubic-bezier(0.16,1,0.3,1), filter 0.7s ease;
    transform: scale(1.05);
    filter: saturate(0.85) brightness(0.85);
  }
  .star-card:hover img {
    transform: scale(1.15) rotate(0.5deg);
    filter: saturate(1.1) brightness(1);
  }
  .star-card .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(5,7,13,0.95) 0%, rgba(5,7,13,0.15) 55%, rgba(5,7,13,0) 100%);
  }
  .star-card .glow {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), 0 0 60px rgba(120,150,255,0.4);
    border-radius: 1rem;
  }
  .star-card:hover .glow { opacity: 1; }
  .star-card .label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 1.1rem 1.1rem 1.3rem;
    transform: translateY(8px);
    transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .star-card:hover .label { transform: translateY(0); }
  .star-card .index {
    position: absolute;
    top: 0.9rem;
    left: 0.9rem;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .star-card:hover .index { opacity: 1; transform: translateY(0); }

  .hero-fade-in {
    opacity: 0;
    transform: translateY(20px);
    animation: heroFadeUp 1s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  body {
    background-image:
      linear-gradient(180deg, rgba(5,7,13,0.55) 0%, rgba(5,7,13,0.85) 45%, rgba(5,7,13,0.97) 100%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  /* Twinkling star field + shooting stars, sit above the bg photo, below content */
  .starfield {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    transition: transform 0.3s ease-out;
  }
  .star-dot {
    position: absolute;
    border-radius: 9999px;
    background: #ffffff;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.8);
    animation-name: twinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }
  .shooting-star-wrap {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    animation-name: shoot-move;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .shooting-star-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 140px;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0));
    border-radius: 9999px;
    transform-origin: left center;
    /* rotation is set inline per element, computed from its own travel direction */
  }
  @keyframes shoot-move {
    0%   { transform: translate(0, 0); opacity: 0; }
    2%   { opacity: 1; }
    16%  { transform: translate(var(--tx), var(--ty)); opacity: 0; }
    100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
  }

  /* Content sits above the starfield */
  .page-content { position: relative; z-index: 2; }

  @media (prefers-reduced-motion: reduce) {
    .star-dot, .shooting-star-wrap { animation: none !important; opacity: 0.4; }
    .starfield { transition: none; }
  }
</style>
</head>
<body class="bg-[#05070d] min-h-screen" style="font-family:'Inter',sans-serif;">

  <div id="starfield" class="starfield"></div>

  <div class="page-content">

  <nav class="sticky top-0 z-50 flex flex-wrap items-center justify-between gap-4 p-4 sm:p-5 bg-[#05070d]/90 backdrop-blur-md border-b border-white/10">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/logo.png" alt="Lithos" class="h-8 sm:h-9 w-auto" />
    </a>
    <div class="flex flex-wrap justify-center absolute left-1/2 -translate-x-1/2 items-center gap-1 bg-white/10 border border-white/20 rounded-full px-2 py-2 max-w-[92vw]">
      <a href="stars.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white">Stars</a>
      <a href="company.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Company</a>
      <a href="notice.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Notice</a>
      <a href="memo.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Memo</a>
    </div>
    <a href="signup.html" id="navAuthBtn" class="bg-white text-gray-900 text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-100">Sign Up</a>
  </nav>

  <!-- Centered intro -->
  <section class="min-h-[50vh] flex flex-col items-center justify-center text-center px-6 py-20">
    <p class="hero-fade-in text-white/50 text-xs font-semibold tracking-[0.3em] uppercase mb-4" style="animation-delay:0.05s;">
      Twelve Stars
    </p>
    <h1 class="hero-fade-in text-white text-5xl sm:text-6xl md:text-7xl font-semibold tracking-tight mb-6 mt-3" style="animation-delay:0.15s;">
      당신이 태어난 달에 맞는 별을 알아보세요
    </h1>
    <p class="hero-fade-in text-white/60 text-sm sm:text-base leading-relaxed max-w-2xl tracking-tight mt-4" style="animation-delay:0.3s;">
      月星談은 당신이 태어난 달에게 주어진 별을 확인하게하며, 또한 그 별이 가지고있는 성격을 알려줍니다.
      그 달에 태어난 사람은 그에 맞는 별과 성격이 대부분 비슷합니다 스크롤을 통해 확인해보세요</p>
  </section>

  <!-- 3x4 star grid -->
  <section class="max-w-6xl mx-auto px-6 pb-28">
    <div id="star-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 sm:gap-6">
      <!-- cards injected by JS -->
    </div>
  </section>

  <footer class="text-center text-white/30 text-xs pb-12">
    <a href="index.html" class="underline hover:text-white/60">← Back to home</a>
  </footer>

  <script src="star-data.js"></script>
  <script>
    const grid = document.getElementById("star-grid");

    STAR_DATA.forEach((star, i) => {
      const card = document.createElement("a");
      card.href = `star-detail.html?star=${star.slug}`;
      card.className = "star-card";
      card.style.transitionDelay = (i % 3) * 90 + "ms";
      card.innerHTML = `
        <span class="index">N&deg;${String(i + 1).padStart(2, "0")}</span>
        <img src="${star.image}" alt="${star.nameKo} / ${star.nameEn}" />
        <div class="overlay"></div>
        <div class="glow"></div>
        <div class="label">
          <p class="text-white/50 text-xs tracking-widest uppercase mb-1">${star.monthKo}</p>
          <p class="text-white text-xl font-semibold tracking-tight">${star.nameKo} / ${star.nameEn}</p>
        </div>
      `;
      grid.appendChild(card);
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll(".star-card").forEach((el) => observer.observe(el));

    // --- Twinkling star field ---
    const starfield = document.getElementById("starfield");

    const STAR_COUNT = 90;
    for (let i = 0; i < STAR_COUNT; i++) {
      const dot = document.createElement("span");
      dot.className = "star-dot";
      const size = Math.random() * 2 + 1; // 1px - 3px
      dot.style.width = size + "px";
      dot.style.height = size + "px";
      dot.style.left = Math.random() * 100 + "vw";
      dot.style.top = Math.random() * 100 + "vh";
      dot.style.animationDuration = (Math.random() * 3 + 2) + "s"; // 2s - 5s
      dot.style.animationDelay = (Math.random() * 5) + "s";
      starfield.appendChild(dot);
    }

    // --- Occasional shooting stars ---
    // Travel vector (dx, dy): currently falling down-and-to-the-RIGHT.
    // To flip the fall direction, just flip the sign of TRAVEL_DX (and swap
    // the spawn-X range below to the opposite side) — the bar's tilt is
    // computed from this same vector, so the streak's angle will always
    // match the direction it's actually moving in.
    const TRAVEL_DX = 480;
    const TRAVEL_DY = 340;
    // The bar should trail *behind* the direction of travel, so it points
    // along the reverse of the travel vector.
    const barAngleDeg = Math.atan2(-TRAVEL_DY, -TRAVEL_DX) * (180 / Math.PI);

    const SHOOTER_COUNT = 3;
    for (let i = 0; i < SHOOTER_COUNT; i++) {
      const wrap = document.createElement("span");
      wrap.className = "shooting-star-wrap";
      wrap.style.top = (Math.random() * 40) + "vh";
      // Spawn on the side travel is coming FROM (left side, since it falls right)
      wrap.style.left = (5 + Math.random() * 40) + "vw";
      wrap.style.setProperty("--tx", TRAVEL_DX + "px");
      wrap.style.setProperty("--ty", TRAVEL_DY + "px");
      wrap.style.animationDuration = (Math.random() * 5 + 6) + "s"; // 6s - 11s
      wrap.style.animationDelay = (Math.random() * 8) + "s";

      const bar = document.createElement("span");
      bar.className = "shooting-star-bar";
      bar.style.transform = `rotate(${barAngleDeg}deg)`;

      wrap.appendChild(bar);
      starfield.appendChild(wrap);
    }

    // --- Mouse parallax on the star field ---
    window.addEventListener("mousemove", (e) => {
      const dx = (e.clientX / window.innerWidth - 0.5) * 24;
      const dy = (e.clientY / window.innerHeight - 0.5) * 24;
      starfield.style.transform = `translate(${dx}px, ${dy}px)`;
    });
  </script>

</body>
</html>
