<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up · Lithos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#05070d] min-h-screen" style="font-family:'Inter',sans-serif;">

  <nav class="sticky top-0 z-50 flex flex-wrap items-center justify-between gap-4 p-4 sm:p-5 bg-[#05070d]/90 backdrop-blur-md border-b border-white/10">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/logo.png" alt="Lithos" class="h-8 sm:h-9 w-auto" />
    </a>
    <div class="flex flex-wrap justify-center absolute left-1/2 -translate-x-1/2 items-center gap-1 bg-white/10 border border-white/20 rounded-full px-2 py-2 max-w-[92vw]">
      <a href="stars.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Stars</a>
      <a href="company.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Company</a>
      <a href="notice.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Notice</a>
      <a href="memo.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-white/80 hover:bg-white/20 hover:text-white transition-colors">Memo</a>
    </div>
    <a href="signup.html" id="navAuthBtn" class="bg-white text-gray-900 text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-100">Sign Up</a>
  </nav>

  <!-- Centered intro + form -->
  <section id="formSection" class="min-h-[85vh] flex flex-col items-center justify-center text-center px-6 py-16">
    <p class="hero-fade-in text-white/50 text-xs font-semibold tracking-[0.3em] uppercase mb-4" style="animation-delay:0.05s;">
      Join Us
    </p>
    <h1 class="hero-fade-in text-white text-5xl sm:text-6xl md:text-7xl font-semibold tracking-tight mb-6" style="animation-delay:0.15s;">
      Sign Up
    </h1>
    <p class="hero-fade-in text-white/60 text-base sm:text-lg leading-relaxed max-w-xl mb-12" style="animation-delay:0.3s;">
      Join 月星談 to find the star that has quietly watched over your month
      since the day you were born.
    </p>

    <div class="glass-card reveal p-8 sm:p-10 w-full max-w-md text-left" style="transition-delay: 0.1s;">
      <form id="signupForm" class="flex flex-col gap-4">
        <div>
          <label class="text-white/50 text-xs tracking-widest uppercase mb-2 block">Name</label>
          <input id="suName" type="text" required placeholder="Your name" class="glow-input w-full rounded-full px-5 py-3 text-white placeholder-white/30" />
        </div>
        <div>
          <label class="text-white/50 text-xs tracking-widest uppercase mb-2 block">Email</label>
          <input id="suEmail" type="email" required placeholder="you@example.com" class="glow-input w-full rounded-full px-5 py-3 text-white placeholder-white/30" />
        </div>
        <div>
          <label class="text-white/50 text-xs tracking-widest uppercase mb-2 block">Birth Month</label>
          <select id="suMonth" class="glow-input w-full rounded-full px-5 py-3 text-white">
            <option class="bg-[#05070d]" value="">Select your birth month</option>
            <option class="bg-[#05070d]">January</option>
            <option class="bg-[#05070d]">February</option>
            <option class="bg-[#05070d]">March</option>
            <option class="bg-[#05070d]">April</option>
            <option class="bg-[#05070d]">May</option>
            <option class="bg-[#05070d]">June</option>
            <option class="bg-[#05070d]">July</option>
            <option class="bg-[#05070d]">August</option>
            <option class="bg-[#05070d]">September</option>
            <option class="bg-[#05070d]">October</option>
            <option class="bg-[#05070d]">November</option>
            <option class="bg-[#05070d]">December</option>
          </select>
        </div>
        <p id="suError" class="text-red-400 text-xs hidden"></p>
        <button type="submit" class="mt-2 bg-[#1e3a5f] hover:bg-[#16293f] text-white text-sm font-medium px-7 py-3 rounded-full transition-all hover:scale-[1.03] active:scale-95 hover:shadow-lg hover:shadow-[#3a5a8f]/30">
          Create Account
        </button>
      </form>
      <p class="text-white/30 text-xs mt-6 text-center">
        ※ 이 브라우저에만 저장돼요 — 별도 서버 없이 로컬에 기록되는 데모 계정이에요.
      </p>
    </div>

    <!-- Success state, shown after signup -->
    <div id="successCard" class="glass-card p-8 sm:p-10 w-full max-w-md text-center hidden">
      <p class="text-white/50 text-xs tracking-widest uppercase mb-3">Welcome</p>
      <p id="successName" class="text-white text-2xl font-semibold mb-4"></p>
      <p class="text-white/60 text-sm mb-6">가입이 완료됐어요. 이제 로그인된 상태로 사이트를 둘러보실 수 있어요.</p>
      <a href="index.html" class="inline-block bg-[#1e3a5f] hover:bg-[#16293f] text-white text-sm font-medium px-7 py-3 rounded-full transition-all">
        홈으로 이동
      </a>
    </div>
  </section>

  <footer class="text-center text-white/30 text-xs pb-12">
    <a href="index.html" class="underline hover:text-white/60">← Back to home</a>
  </footer>

  <script>
    const MEMBERS_KEY = "lithosMembers";
    const CURRENT_USER_KEY = "lithosCurrentUser";

    function loadMembers() {
      try {
        const raw = localStorage.getItem(MEMBERS_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }
    function saveMembers(list) {
      try {
        localStorage.setItem(MEMBERS_KEY, JSON.stringify(list));
      } catch (e) {}
    }

    document.getElementById("signupForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("suName").value.trim();
      const email = document.getElementById("suEmail").value.trim();
      const month = document.getElementById("suMonth").value;
      const errorEl = document.getElementById("suError");

      if (!name || !email) {
        errorEl.textContent = "이름과 이메일을 입력해주세요.";
        errorEl.classList.remove("hidden");
        return;
      }

      const members = loadMembers();
      const member = {
        name,
        email,
        month: month || "-",
        joinedAt: new Date().toISOString(),
      };
      members.push(member);
      saveMembers(members);
      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(member));

      document.getElementById("signupForm").closest(".glass-card").classList.add("hidden");
      const successCard = document.getElementById("successCard");
      successCard.classList.remove("hidden");
      document.getElementById("successName").textContent = `${name}님, 환영해요!`;

      const navBtn = document.getElementById("navAuthBtn");
      if (navBtn) {
        navBtn.textContent = "Log Out";
        navBtn.removeAttribute("href");
        navBtn.style.cursor = "pointer";
        navBtn.addEventListener("click", (evt) => {
          evt.preventDefault();
          if (window.openLogoutConfirm) window.openLogoutConfirm();
        });
      }
    });
  </script>

  <script src="common.js"></script>

</body>
</html>
